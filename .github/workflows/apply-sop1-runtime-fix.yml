name: Apply SOP1 runtime background fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify target version and apply patch
        shell: bash
        run: |
          set -euo pipefail

          expected_bg="0373012c9a7a8e4fa370c95fb3f1864234e3c101"
          expected_sop1="6da7ec4b6ad16f0f4283f7b2154f720833be37ae"

          current_bg="$(git hash-object background_service.py)"
          current_sop1="$(git hash-object sop1_breakdown.py)"

          if [ "$current_bg" != "$expected_bg" ]; then
            echo "background_service.py changed since patch preparation: $current_bg"
            exit 20
          fi

          if [ "$current_sop1" != "$expected_sop1" ]; then
            echo "sop1_breakdown.py changed since patch preparation: $current_sop1"
            exit 21
          fi

          mkdir -p /tmp/sop1_runtime_fix
          printf '%s' '' | base64 -d > /tmp/sop1_runtime_fix/patch.zip

          unzip -q -o /tmp/sop1_runtime_fix/patch.zip -d /tmp/sop1_runtime_fix/unpacked

          test -f /tmp/sop1_runtime_fix/unpacked/background_service.py
          test -f /tmp/sop1_runtime_fix/unpacked/sop1_breakdown.py

          python -m py_compile /tmp/sop1_runtime_fix/unpacked/background_service.py /tmp/sop1_runtime_fix/unpacked/sop1_breakdown.py

          cp /tmp/sop1_runtime_fix/unpacked/background_service.py background_service.py
          cp /tmp/sop1_runtime_fix/unpacked/sop1_breakdown.py sop1_breakdown.py

          python -m py_compile background_service.py sop1_breakdown.py

          rm -f .github/workflows/apply-sop1-runtime-fix.yml .runtime_fix_trigger

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix SOP1 background runtime handling"
          git push origin HEAD:main
